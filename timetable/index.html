<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>文化祭タイムテーブル</title>
<style>
  :root {
    --row-h: 22px;
    --cat-pink-bg: #dba9b3;
    --cat-pink-fg: #5b2430;
    --cat-cyan-bg: #b8e6ec;
    --cat-cyan-fg: #0b4a52;
    --cat-purple-bg: #cdc7ee;
    --cat-purple-fg: #362a70;
    --cat-closed-bg: #9a9a9a;
    --cat-closed-fg: #fff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    color: #222;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 16px 12px 40px; }

  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-btn {
    flex: 1;
    appearance: none;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 999px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #555;
  }
  .tab-btn.active.theme-purple { background: #7266c2; border-color: #7266c2; color: #fff; }
  .tab-btn.active.theme-cyan { background: #1fb8d4; border-color: #1fb8d4; color: #fff; }

  .board {
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    border: 1px solid rgba(0,0,0,.06);
    background: transparent;
  }
  .board-title {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    padding: 12px 0 8px;
    color: #fff;
    letter-spacing: .05em;
  }
  .board-subtitle {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 0;
    color: #fff;
  }
  .theme-purple .board-title { background: linear-gradient(#8a7fc9, #7266c2); }
  .theme-purple .board-subtitle { background: #a79ce0; }
  .theme-purple .grid-wrap thead th { background: #d9d4f2; }
  .theme-purple td.hour-cell, .theme-purple td.min-cell { background: rgba(217,212,242,.55); }

  .theme-cyan .board-title { background: linear-gradient(#29c4dd, #1fb8d4); }
  .theme-cyan .board-subtitle { background: #5cd3e8; }
  .theme-cyan .grid-wrap thead th { background: #c9f0f6; }
  .theme-cyan td.hour-cell, .theme-cyan td.min-cell { background: rgba(201,240,246,.55); }

  .grid-wrap { position: relative; }
  table.grid {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 12px;
  }
  .grid th, .grid td {
    border: 1px solid #cfcfcf;
    text-align: center;
    padding: 0 3px;
    overflow: hidden;
  }
  .grid thead th {
    font-weight: 700;
    padding: 8px 3px;
    font-size: 13px;
    line-height: 1.3;
  }
  .grid tbody tr { height: var(--row-h); }
  .grid td.hour-cell {
    font-size: 20px;
    font-weight: 800;
    color: #333;
  }
  .grid td.min-cell {
    font-size: 10px;
    color: #777;
  }
  .grid td.empty { background: transparent; }
  .grid td.empty.is-past { background: rgba(0,0,0,.08); }

  .event-cell {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.4;
    white-space: pre-line;
  }
  .event-cell .time-range { font-size: 10px; font-weight: 400; opacity: .85; }
  .event-cell.cat-pink   { background: var(--cat-pink-bg);   color: var(--cat-pink-fg); }
  .event-cell.cat-cyan   { background: var(--cat-cyan-bg);   color: var(--cat-cyan-fg); }
  .event-cell.cat-purple { background: var(--cat-purple-bg); color: var(--cat-purple-fg); }
  .event-cell.cat-closed { background: var(--cat-closed-bg); color: var(--cat-closed-fg); font-size: 13px; }
  .event-cell.is-past { filter: grayscale(1) opacity(.5); }

  .now-line {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid #ff3b3b;
    z-index: 5;
    pointer-events: none;
  }
  .now-line::before {
    content: attr(data-time);
    position: absolute;
    left: 2px;
    top: -9px;
    background: #ff3b3b;
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
  }
</style>
</head>
<body>
  <div id="app">
    <div class="tabs" id="dayTabs"></div>
    <div id="boards"></div>
  </div>

  <script>
    const ROW_MIN = 10; // 1行あたりの分数
    const ROW_H = 22;   // --row-h と合わせる(px)

    function toMinutes(t) {
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    }

    // テスト用: ?now=HH:MM&day=day1 で任意の現在時刻を再現できる(本番では未指定でOK)
    function getDebugOverride() {
      const params = new URLSearchParams(location.search);
      const now = params.get('now');
      const day = params.get('day');
      if (!now) return null;
      return { now, day };
    }

    function leafColumns(columns) {
      const leaves = [];
      columns.forEach(col => {
        if (col.children) {
          col.children.forEach(c => leaves.push(Object.assign({}, c, { parentKey: col.key })));
        } else {
          leaves.push(col);
        }
      });
      return leaves;
    }

    function buildOccupancy(leaves, events, startMin, rows) {
      const occ = {};
      leaves.forEach(l => { occ[l.key] = new Array(rows).fill(null); });

      events.forEach(ev => {
        const colIdxs = ev.columns.map(k => leaves.findIndex(l => l.key === k));
        if (colIdxs.some(i => i === -1)) return;
        const startRow = (toMinutes(ev.start) - startMin) / ROW_MIN;
        const span = (toMinutes(ev.end) - toMinutes(ev.start)) / ROW_MIN;
        if (startRow < 0 || span <= 0) return;

        for (let ro = 0; ro < span; ro++) {
          for (let co = 0; co < colIdxs.length; co++) {
            const key = leaves[colIdxs[co]].key;
            const row = startRow + ro;
            if (row >= rows) continue;
            if (ro === 0 && co === 0) {
              occ[key][row] = { event: ev, span, colSpan: colIdxs.length };
            } else {
              occ[key][row] = 'skip';
            }
          }
        }
      });
      return occ;
    }

    function renderBoard(day, nowInfo) {
      const startMin = toMinutes(day.startTime);
      const endMin = toMinutes(day.endTime);
      const rows = (endMin - startMin) / ROW_MIN;
      const leaves = leafColumns(day.columns);
      const occ = buildOccupancy(leaves, day.events, startMin, rows);

      const board = document.createElement('div');
      board.className = 'board theme-' + day.theme;

      const title = document.createElement('div');
      title.className = 'board-title';
      title.textContent = day.title;
      board.appendChild(title);

      const subtitle = document.createElement('div');
      subtitle.className = 'board-subtitle';
      subtitle.textContent = day.subtitle;
      board.appendChild(subtitle);

      const wrap = document.createElement('div');
      wrap.className = 'grid-wrap';

      const table = document.createElement('table');
      table.className = 'grid';

      // colgroup: hour, minute, + leaves
      const colgroup = document.createElement('colgroup');
      const widths = [8, 7]; // hour, minute (%)
      const remain = 100 - widths[0] - widths[1];
      const each = remain / leaves.length;
      widths.push(...leaves.map(() => each));
      widths.forEach(w => {
        const c = document.createElement('col');
        c.style.width = w + '%';
        colgroup.appendChild(c);
      });
      table.appendChild(colgroup);

      // thead
      const thead = document.createElement('thead');
      const trHead1 = document.createElement('tr');
      const timeTh = document.createElement('th');
      timeTh.colSpan = 2;
      timeTh.rowSpan = 2;
      timeTh.textContent = 'TIME';
      trHead1.appendChild(timeTh);

      const trHead2 = document.createElement('tr');

      day.columns.forEach(col => {
        if (col.children) {
          const th = document.createElement('th');
          th.colSpan = col.children.length;
          th.textContent = col.label;
          trHead1.appendChild(th);
          col.children.forEach(c => {
            const th2 = document.createElement('th');
            th2.textContent = c.label;
            trHead2.appendChild(th2);
          });
        } else {
          const th = document.createElement('th');
          th.rowSpan = 2;
          th.innerHTML = Array.isArray(col.label) ? col.label.join('<br>') : col.label;
          trHead1.appendChild(th);
        }
      });

      thead.appendChild(trHead1);
      thead.appendChild(trHead2);
      table.appendChild(thead);

      // tbody
      const tbody = document.createElement('tbody');
      const startHour = Math.floor(startMin / 60);

      for (let r = 0; r < rows; r++) {
        const tr = document.createElement('tr');
        const rowStartMin = startMin + r * ROW_MIN;
        const isPastRow = nowInfo && nowInfo.isToday && (rowStartMin + ROW_MIN) <= nowInfo.nowMin;

        if (r % 6 === 0) {
          const hourTd = document.createElement('td');
          hourTd.className = 'hour-cell';
          hourTd.rowSpan = 6;
          hourTd.textContent = startHour + Math.floor(r / 6);
          tr.appendChild(hourTd);
        }

        const minTd = document.createElement('td');
        minTd.className = 'min-cell';
        minTd.textContent = rowStartMin % 60;
        tr.appendChild(minTd);

        leaves.forEach(leaf => {
          const cell = occ[leaf.key][r];
          if (cell === 'skip') return;
          if (cell && cell.event) {
            const td = document.createElement('td');
            td.rowSpan = cell.span;
            if (cell.colSpan > 1) td.colSpan = cell.colSpan;
            td.className = 'event-cell cat-' + cell.event.category;
            const evEndMin = toMinutes(cell.event.end);
            if (nowInfo && nowInfo.isToday && evEndMin <= nowInfo.nowMin) {
              td.classList.add('is-past');
            }
            const titleEl = document.createElement('div');
            titleEl.textContent = cell.event.title;
            td.appendChild(titleEl);
            if (cell.event.category !== 'closed') {
              const timeEl = document.createElement('div');
              timeEl.className = 'time-range';
              timeEl.textContent = cell.event.start + '-' + cell.event.end;
              td.appendChild(timeEl);
            }
            tr.appendChild(td);
          } else {
            const td = document.createElement('td');
            td.className = 'empty' + (isPastRow ? ' is-past' : '');
            tr.appendChild(td);
          }
        });

        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      wrap.appendChild(table);
      board.appendChild(wrap);

      // 現在時刻ライン
      if (nowInfo && nowInfo.isToday && nowInfo.nowMin >= startMin && nowInfo.nowMin <= endMin) {
        const line = document.createElement('div');
        line.className = 'now-line';
        const h = String(Math.floor(nowInfo.nowMin / 60)).padStart(2, '0');
        const m = String(nowInfo.nowMin % 60).padStart(2, '0');
        line.dataset.time = h + ':' + m;
        wrap.appendChild(line);

        requestAnimationFrame(() => {
          const theadH = thead.getBoundingClientRect().height;
          const offsetMin = nowInfo.nowMin - startMin;
          const top = theadH + (offsetMin / ROW_MIN) * ROW_H;
          line.style.top = top + 'px';
        });
      }

      return board;
    }

    function todayString(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    let allDays = [];
    let currentDayId = null;
    const debug = getDebugOverride();

    function computeNowInfo(day) {
      const real = new Date();
      let isToday = todayString(real) === day.date;
      let nowMin;
      if (debug && (!debug.day || debug.day === day.id)) {
        isToday = true;
        nowMin = toMinutes(debug.now);
      } else {
        nowMin = real.getHours() * 60 + real.getMinutes();
      }
      return { isToday, nowMin };
    }

    function render() {
      const tabsEl = document.getElementById('dayTabs');
      tabsEl.innerHTML = '';
      allDays.forEach(day => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn theme-' + day.theme + (day.id === currentDayId ? ' active' : '');
        btn.textContent = day.title;
        btn.addEventListener('click', () => { currentDayId = day.id; render(); });
        tabsEl.appendChild(btn);
      });

      const boardsEl = document.getElementById('boards');
      boardsEl.innerHTML = '';
      const day = allDays.find(d => d.id === currentDayId);
      if (!day) return;
      const nowInfo = computeNowInfo(day);
      boardsEl.appendChild(renderBoard(day, nowInfo));
    }

    fetch('../data/timetable.json')
      .then(res => res.json())
      .then(data => {
        allDays = data.days || [];
        currentDayId = allDays.length ? allDays[0].id : null;
        render();
        setInterval(render, 60000);
      })
      .catch(err => {
        console.error('Error loading timetable:', err);
        document.getElementById('boards').innerHTML =
          '<div style="text-align:center;color:#999;padding:40px 0;">タイムテーブルの読み込みに失敗しました</div>';
      });
  </script>
</body>
</html>
