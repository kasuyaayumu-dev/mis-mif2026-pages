<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>文化祭マップ</title>
  <style>
    html, body {
      margin: 0;
      background: transparent;
      height: 100%;
    }
    .coming-soon {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 320px;
      padding: 40px 20px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      color: #333;
    }
    .coming-soon .icon {
      font-size: 40px;
      margin-bottom: 4px;
    }
    .coming-soon h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .04em;
      color: #333;
    }
    .coming-soon p {
      margin: 0;
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <div class="icon">🗺️</div>
    <h1>Coming Soon</h1>
    <p>会場マップは公開準備中です。<br>もうしばらくお待ちください。</p>
  </div>
</body>
</html>
